<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="vide" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>vide</title>
    <style>
      * { box-sizing: border-box }
      html, body { margin: 0; min-height: 100% }
      body { background: #09090b; color: #e4e4e7; font: 15px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; padding: calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 24px) }
      main { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
      header { display: flex; align-items: center; gap: 12px }
      header img { width: 32px; height: 32px }
      h1 { font-size: 20px; margin: 0; font-weight: 600 }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px }
      li { display: flex; align-items: center; gap: 12px; border: 1px solid #27272a; background: #18181b; border-radius: 12px; padding: 0 6px 0 14px }
      li a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; padding: 14px 0 }
      li span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
      .dot { width: 8px; height: 8px; border-radius: 9999px; background: #52525b; flex: none }
      .dot.on { background: #34d399 }
      li button { border: 0; background: none; color: #71717a; font-size: 20px; width: 36px; height: 36px; border-radius: 8px }
      li button:active { background: #27272a }
      p { margin: 0; color: #71717a; font-size: 13px }
      form { display: flex; gap: 8px }
      input { flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1px solid #27272a; background: #18181b; color: #f4f4f5; padding: 0 14px; font: inherit; outline: none }
      input:focus { border-color: #52525b }
      form button { height: 46px; border: 0; border-radius: 12px; background: #f4f4f5; color: #09090b; font-weight: 600; font-size: 15px; padding: 0 18px }
    </style>
  </head>
  <body>
    <main>
      <header><img src="/icon.svg" alt="" /><h1>vide</h1></header>
      <ul id="list"></ul>
      <p id="empty">No instances yet. Paste a pairing link from vide → Settings → Web access.</p>
      <form id="add"><input id="link" type="url" placeholder="Pairing link" autocomplete="off" required /><button type="submit">Add</button></form>
    </main>
    <script src="/hub.js"></script>
  </body>
</html>

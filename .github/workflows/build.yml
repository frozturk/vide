name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
      - run: npm run build:litemux
      - run: npm run test:litemux
      - run: npm run typecheck
      - run: npm test
      - run: npm run package -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: vide-windows
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: vide-macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes vide-windows/*.exe vide-macos/*.dmg
        env:
          GH_TOKEN: ${{ github.token }}
